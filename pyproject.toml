[project]
name = "research-evidence-console"
version = "0.1.0"
description = "Traceable abstract evidence analysis for research questions"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "langgraph>=0.2", "openai>=1.40", "python-dotenv>=1.0", "streamlit>=1.38", "scikit-learn>=1.5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["evidence_pipeline", "demo_examples"]
